<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChronoLock | Strict Protocol</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --primary: #66fcf1;
            --secondary: #45a29e;
            --surface: #1f2833;
            --text: #c5c6c7;
            --error: #ff5252;
            --glass: rgba(31, 40, 51, 0.85);
        }

        body.theme-birthday { --bg-color: #1a0b16; --primary: #ff4081; --secondary: #ffd54f; --surface: #3a1c31; }
        body.theme-treasure { --bg-color: #12100a; --primary: #d4af37; --secondary: #8d6e63; --surface: #2a2416; }
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; text-align: center;
            user-select: none; -webkit-user-select: none;
            transition: all 0.5s ease;
        }

        .container {
            background: var(--glass);
            padding: 2rem; border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
            max-width: 480px; width: 90%;
        }

        h1 { color: var(--primary); margin: 0 0 5px 0; font-size: 1.8rem; text-transform: uppercase; letter-spacing: 2px;}
        p.subtitle { font-size: 0.85rem; color: #888; margin-bottom: 25px; }

        .form-grid { display: grid; gap: 15px; text-align: left; }
        .form-group label { display: block; font-size: 0.8rem; color: var(--secondary); margin-bottom: 6px; font-weight: 600; text-transform: uppercase;}
        
        input[type="text"], input[type="password"], input[type="datetime-local"], select, textarea {
            width: 100%; padding: 12px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            color: white; border-radius: 8px;
            box-sizing: border-box; font-family: inherit;
            transition: border 0.3s, box-shadow 0.3s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 10px rgba(102, 252, 241, 0.2); }
        textarea { resize: vertical; min-height: 100px; }

        .checkbox-group { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 0.9rem; color: #aaa;}
        .checkbox-group input { width: auto; cursor: pointer; }

        button {
            background: var(--primary); color: #000;
            border: none; padding: 14px; border-radius: 8px;
            font-weight: 800; font-size: 1rem; cursor: pointer;
            width: 100%; margin-top: 10px; text-transform: uppercase;
            transition: all 0.2s;
        }
        button:hover { filter: brightness(1.1); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102, 252, 241, 0.3); }
        button:active { transform: translateY(0); }
        
        .hidden { display: none !important; }

        /* Secret Message Display */
        #secret-message-box {
            margin-top: 20px; padding: 30px 20px;
            background: rgba(0,0,0,0.6);
            border-left: 4px solid var(--primary);
            border-radius: 4px 12px 12px 4px;
            font-size: 1.1rem; line-height: 1.6;
            word-wrap: break-word; position: relative;
        }
        .blurred-text { filter: blur(12px); opacity: 0.3; pointer-events: none; transition: all 0.3s ease; }
        
        #countdown { font-size: 2.5rem; color: var(--primary); font-weight: 900; margin: 20px 0; font-variant-numeric: tabular-nums; }
        #status-indicator { display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; background: rgba(0,0,0,0.5); margin-bottom: 15px;}
        .status-syncing { color: #ffd54f; border: 1px solid #ffd54f; }
        .status-locked { color: var(--error); border: 1px solid var(--error); }
        .status-open { color: var(--primary); border: 1px solid var(--primary); }

        #link-output { background: #000; color: #888; font-family: monospace; user-select: all; cursor: text; margin-bottom: 10px; }
        .secondary-btn { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
        .secondary-btn:hover { background: rgba(102, 252, 241, 0.1); }
    </style>
</head>
<body>

    <!-- CREATOR PANEL -->
    <div id="creator-panel" class="container hidden">
        <h1>Seal Protocol</h1>
        <p class="subtitle">Time-locked, end-to-end encrypted messaging.</p>
        
        <div class="form-grid">
            <div class="form-group">
                <label>Target Payload (Message)</label>
                <textarea id="msg-input" placeholder="Enter classified data..."></textarea>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label>Unlock Time</label>
                    <input type="datetime-local" id="time-input">
                </div>
                <div class="form-group">
                    <label>Self-Destruct</label>
                    <select id="expiry-type" onchange="toggleCustomExpiry()">
                        <option value="never">Never (Unlimited)</option>
                        <option value="1h">1 Hour after unlock</option>
                        <option value="1d">1 Day after unlock</option>
                        <option value="2d">2 Days after unlock</option>
                        <option value="custom">Custom Date/Time</option>
                    </select>
                </div>
            </div>

            <div class="form-group hidden" id="custom-expiry-group">
                <input type="datetime-local" id="custom-expiry-input">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label>Visual Theme</label>
                    <select id="theme-input">
                        <option value="default">Cyber Security</option>
                        <option value="birthday">Birthday Surprise</option>
                        <option value="treasure">Treasure Hunt</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Encryption Key (Pass)</label>
                    <input type="password" id="pass-input" placeholder="Required">
                </div>
            </div>

            <label class="checkbox-group">
                <input type="checkbox" id="show-timer-input" checked>
                Show live countdown timer to receiver
            </label>
            
            <button onclick="generateLink()">Initialize Lock</button>
        </div>
        
        <div id="link-container" class="form-group hidden" style="margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
            <label>Secure Transmission Link:</label>
            <input type="text" id="link-output" readonly>
            <button id="copy-btn" class="secondary-btn" onclick="copyLink()">📋 Copy Link</button>
        </div>
    </div>

    <!-- RECEIVER PANEL -->
    <div id="receiver-panel" class="container hidden">
        <div id="status-indicator" class="status-syncing">Syncing Network Time...</div>
        <h1 id="receiver-title">Encrypted Data</h1>
        <p class="subtitle" id="receiver-subtitle">Authenticating temporal coordinates.</p>
        
        <div id="countdown" class="hidden"></div>
        
        <div id="unlock-section" class="hidden">
            <div class="form-group" style="text-align: left;">
                <label>Enter Decryption Key</label>
                <input type="password" id="decrypt-pass" placeholder="••••••••">
                <button onclick="decryptMessage()">Decrypt Payload</button>
            </div>
        </div>

        <div id="message-section" class="hidden">
            <p style="font-size: 0.8rem; color: var(--secondary); margin: 0;">PRESS AND HOLD TO REVEAL</p>
            <p style="font-size: 0.65rem; color: #777;">Prevents unauthorized screenshots</p>
            <div id="secret-message-box">
                <span id="revealed-text" class="blurred-text"></span>
            </div>
            <button id="reveal-btn" style="margin-top:20px; user-select: none;">🧿 HOLD TO READ</button>
        </div>

        <div id="destroyed-section" class="hidden">
            <h1 style="color: var(--error); font-size: 3rem; margin:10px 0;">☠️</h1>
            <h2 style="color: var(--error);">Payload Destroyed</h2>
            <p style="color: #aaa;">The time window for this message has permanently expired.</p>
        </div>
    </div>

    <script>
        // --- Network Time Sync (Anti-Cheat) ---
        let timeOffset = 0;
        let timeSynced = false;

        async function syncTrueTime() {
            try {
                // Fetch header from the current site to get true server time, avoiding CORS
                const res = await fetch(window.location.href, { method: 'HEAD', cache: 'no-store' });
                const serverDate = res.headers.get('Date');
                if (serverDate) {
                    const trueTime = new Date(serverDate).getTime();
                    timeOffset = trueTime - Date.now();
                    timeSynced = true;
                }
            } catch(e) {
                console.warn("Time sync failed, using local clock.");
            }
        }

        function getNow() { return Date.now() + timeOffset; }

        // --- Crypto (AES-GCM) ---
        const enc = new TextEncoder(), dec = new TextDecoder();
        async function getPasswordKey(password) {
            const keyMat = await crypto.subtle.importKey("raw", enc.encode(password), {name: "PBKDF2"}, false, ["deriveKey"]);
            return crypto.subtle.deriveKey(
                { name: "PBKDF2", salt: enc.encode("ChronoSalt"), iterations: 100000, hash: "SHA-256" },
                keyMat, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
            );
        }
        async function encryptData(text, password) {
            const key = await getPasswordKey(password);
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const encData = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, enc.encode(text));
            return { iv: Array.from(iv), data: Array.from(new Uint8Array(encData)) };
        }
        async function decryptData(encData, ivArray, password) {
            try {
                const key = await getPasswordKey(password);
                return dec.decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: new Uint8Array(ivArray) }, key, new Uint8Array(encData)));
            } catch (e) { return null; }
        }

        // --- UI Logic ---
        function toggleCustomExpiry() {
            const type = document.getElementById('expiry-type').value;
            document.getElementById('custom-expiry-group').classList.toggle('hidden', type !== 'custom');
        }

        window.onload = async () => {
            if (window.location.hash.length > 10) {
                document.getElementById('receiver-panel').classList.remove('hidden');
                await syncTrueTime();
                initReceiver();
            } else {
                document.getElementById('creator-panel').classList.remove('hidden');
                const now = new Date(); now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                document.getElementById('time-input').value = now.toISOString().slice(0,16);
            }
        };

        document.addEventListener('copy', (e) => {
            if (document.activeElement.id === 'link-output') return;
            e.clipboardData.setData('text/plain', "[DATA EXPUNGED]"); e.preventDefault();
        });

        // 1. Generate Link
        async function generateLink() {
            const msg = document.getElementById('msg-input').value;
            const timeVal = document.getElementById('time-input').value;
            const pass = document.getElementById('pass-input').value;
            const theme = document.getElementById('theme-input').value;
            const showTimer = document.getElementById('show-timer-input').checked ? 1 : 0;
            const expiryType = document.getElementById('expiry-type').value;

            if (!msg || !timeVal || !pass) return alert("Missing required fields.");
            const unlockTime = new Date(timeVal).getTime();
            let expiryTime = 0; // 0 = never

            if (expiryType === '1h') expiryTime = unlockTime + (60 * 60 * 1000);
            else if (expiryType === '1d') expiryTime = unlockTime + (24 * 60 * 60 * 1000);
            else if (expiryType === '2d') expiryTime = unlockTime + (48 * 24 * 60 * 60 * 1000);
            else if (expiryType === 'custom') {
                const cExp = document.getElementById('custom-expiry-input').value;
                if (!cExp) return alert("Set custom expiry date!");
                expiryTime = new Date(cExp).getTime();
                if (expiryTime <= unlockTime) return alert("Expiry must be AFTER unlock time.");
            }

            const encrypted = await encryptData(msg, pass);
            const payload = { t: unlockTime, e: expiryTime, th: theme, st: showTimer, i: encrypted.iv, d: encrypted.data };
            
            document.getElementById('link-container').classList.remove('hidden');
            document.getElementById('link-output').value = `${window.location.origin}${window.location.pathname}#${btoa(JSON.stringify(payload))}`;
        }

        function copyLink() {
            const link = document.getElementById('link-output'); link.select(); navigator.clipboard.writeText(link.value);
            document.getElementById('copy-btn').innerText = "✅ COPIED";
            setTimeout(() => document.getElementById('copy-btn').innerText = "📋 COPY LINK", 2000);
        }

        // 2. Receiver Logic
        let rPayload = null, timerInt;
        function initReceiver() {
            try {
                rPayload = JSON.parse(atob(window.location.hash.substring(1)));
                if(rPayload.th) {
                    document.body.className = `theme-${rPayload.th}`;
                    if(rPayload.th === 'birthday') document.getElementById('receiver-title').innerText = "🎂 Surprise";
                    if(rPayload.th === 'treasure') document.getElementById('receiver-title').innerText = "🗺️ Coordinates";
                }
                checkTimeLock(); timerInt = setInterval(checkTimeLock, 1000);
            } catch (e) {
                document.getElementById('status-indicator').innerText = "ERROR";
                document.getElementById('receiver-subtitle').innerText = "Link is corrupted.";
            }
        }

        function checkTimeLock() {
            if (!rPayload) return;
            const now = getNow();
            const ind = document.getElementById('status-indicator');

            // Destroyed
            if (rPayload.e !== 0 && now > rPayload.e) {
                clearInterval(timerInt);
                ['countdown', 'unlock-section', 'message-section'].forEach(id => document.getElementById(id).classList.add('hidden'));
                document.getElementById('destroyed-section').classList.remove('hidden');
                ind.className = 'status-locked'; ind.innerText = "OFFLINE";
                return;
            }

            // Locked
            if (now < rPayload.t) {
                ind.className = 'status-locked'; ind.innerText = "LOCKED";
                
                if (rPayload.st === 1) {
                    document.getElementById('countdown').classList.remove('hidden');
                    document.getElementById('receiver-subtitle').innerText = "Time window opens in:";
                    const diff = rPayload.t - now;
                    const d = Math.floor(diff / 86400000), h = Math.floor((diff % 86400000) / 3600000);
                    const m = Math.floor((diff % 3600000) / 60000), s = Math.floor((diff % 60000) / 1000);
                    document.getElementById('countdown').innerText = 
                        `${d > 0 ? d+'d ' : ''}${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                } else {
                    document.getElementById('receiver-subtitle').innerText = "This message is time-locked. The sender has hidden the timer.";
                }
            } 
            // Unlocked
            else {
                ind.className = 'status-open'; ind.innerText = "ACCESS GRANTED";
                document.getElementById('countdown').classList.add('hidden');
                document.getElementById('receiver-subtitle').innerText = "Time window is active.";
                if (document.getElementById('message-section').classList.contains('hidden')) {
                    document.getElementById('unlock-section').classList.remove('hidden');
                }
            }
        }

        async function decryptMessage() {
            const text = await decryptData(rPayload.d, rPayload.i, document.getElementById('decrypt-pass').value);
            if (text) {
                document.getElementById('unlock-section').classList.add('hidden');
                document.getElementById('message-section').classList.remove('hidden');
                document.getElementById('revealed-text').innerText = text;
                setupPress();
            } else alert("Invalid Key.");
        }

        function setupPress() {
            const btn = document.getElementById('reveal-btn'), text = document.getElementById('revealed-text');
            const show = () => { text.classList.remove('blurred-text'); btn.style.background = "var(--secondary)"; };
            const hide = () => { text.classList.add('blurred-text'); btn.style.background = ""; };
            btn.addEventListener('mousedown', show); window.addEventListener('mouseup', hide);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); show(); }, {passive: false});
            window.addEventListener('touchend', hide); window.addEventListener('touchcancel', hide);
        }
    </script>
</body>
</html>
